<!doctype html>
<!-- Drakter: adaptado de showcase/desktop.html de Roamies (8f0adaa, AGPL-3.0). Cambios: lang, título, CSP, rutas de las
     fuentes, aria-label, bridge.js y drakter-voice-out.js, scripts en línea pasados a boot.js y boot-fonts.js, y sin
     minis, agent-home, people, sidebar ni pen (docs/floating/CONTRACT.md §11.1). Lista en README.md. -->
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Drakter: CSP de §11.6 (main añade frame-ancestors 'none' en la cabecera de app://floating). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'none'; media-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<!-- Drakter: el título es la regla de casado de la extensión GNOME (§4.1). -->
<title>drakter-floating</title>
<style>
  /* Bubble and research-card text (the setup guide's body font). */
  /* Drakter: rutas fonts/ en vez de onboarding/fonts/ en las cuatro @font-face. */
  @font-face { font-family: "Martian Mono"; src: url("fonts/martian-mono.woff2") format("woff2"); font-weight: 100 800; font-display: swap; }
  /* Arabic (Readex Pro): the letters of an Arabic reply, which Martian Mono has none of. */
  @font-face {
    font-family: "Roamies Arabic";
    src: url("fonts/readex-pro-arabic.woff2") format("woff2");
    font-weight: 160 700;
    font-display: swap;
    /* Arabic letters only: the Latin side of every stack stays Martian Mono, spaces and all. */
    unicode-range: U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F, U+2010-2011, U+204F;
  }
  @font-face {
    font-family: "Roamies Arabic RTL";
    src: url("fonts/readex-pro-arabic.woff2") format("woff2");
    font-weight: 160 700;
    font-display: swap;
    /* The same file, also taking the space and common punctuation: first in the stack of right-to-left text only, so Arabic
       words and their ! . , ? sit a normal distance apart instead of a full monospace cell. */
    unicode-range: U+0020-0021, U+0028-0029, U+002C-002E, U+003A-003B, U+003F, U+00A0, U+0600-06FF, U+0750-077F, U+08A0-08FF, U+FB50-FDFF, U+FE70-FEFF, U+200C-200F, U+2010-2011, U+204F;
  }
/* Headings on drawn cards and tickets. */
  @font-face { font-family: "Doto"; src: url("fonts/doto.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  /* Sized and moved by core.js to cover just what's drawn. */
  canvas { position: fixed; left: 0; top: 0; display: block; cursor: grab; touch-action: none; transform-origin: 0 0; will-change: transform;
    /* Never selectable: a stray triple-click or Select All tints a selected canvas solid grey over its whole box. */
    -webkit-user-select: none; user-select: none; }
  canvas:active { cursor: grabbing; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Drakter en el escritorio"></canvas>
<script src="bridge.js"></script>
<script src="roamies/core.js"></script>
<script src="roamies/markdown.js"></script>
<script src="roamies/sfx.js"></script>
<script src="roamies/voice-out.js"></script>
<script src="drakter-voice-out.js"></script>
<script src="roamies/glass.js"></script>
<script src="roamies/agent.js"></script>
<script src="roamies/agent-tools.js"></script>
<script src="roamies/agent-cards.js"></script>
<script src="roamies/agent-panel.js"></script>
<script src="roamies/jarvis.js"></script>
<script src="roamies/10-dither.js"></script>
<script src="roamies/12-sidekick.js"></script>
<script src="boot.js"></script>
<script src="roamies/ink3d.js"></script>
<script src="roamies/world.js"></script>
<script src="roamies/ink.js"></script>
<script src="boot-fonts.js"></script>
<script src="roamies/ask-bar.js"></script>
<script src="roamies/notch.js"></script>
<script src="roamies/host.js"></script>
</body>
</html>
