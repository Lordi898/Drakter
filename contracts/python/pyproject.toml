[project]
name = "drakter-contracts"
version = "1.0.0"
description = "Contratos compartidos de Drakter: formatos, errores, herramientas, eventos y modelos"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drakter_contracts"]
