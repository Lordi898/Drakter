name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (comprobaciones críticas)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Sin clave de API: las comprobaciones no llaman al modelo.
      PYTHONPATH: .:../contracts/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Instalar dependencias (Python 3.12 de backend/.python-version)
        run: uv sync --locked
      - name: Directorio temporal
        run: |
          echo "TMPDIR=$RUNNER_TEMP/drakter" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/drakter"
      - name: requirements.txt al día con uv.lock
        run: ../scripts/export-requirements.sh --check
      - name: Migraciones, copia y restauración
        run: .venv/bin/python migrations/check_migrations.py
      - name: Confirmaciones de acciones destructivas
        run: .venv/bin/python tests/critical/check_confirmations.py
      - name: Seguridad del backend
        run: .venv/bin/python tests/check_security.py
      - name: La memoria no sobrescribe las reglas
        run: .venv/bin/python tests/check_memory_rules.py
      - name: Perfiles de voz (plantilla, alias, modelo de pago, herramientas)
        run: .venv/bin/python tests/check_voice_profiles.py

  desktop:
    name: Escritorio (typecheck + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Typecheck y build
        run: npm run build
