# Capa 0 de la voz (V-10): listas cerradas, sin LLM. Las usa voice/conversation/layer0.py.
# Se comparan en minúsculas, sin tildes ni signos. Una frase cuenta si aparece entera y el resto
# del enunciado son solo muletillas (`fillers`). Añadir una expresión es editar este archivo.

# Muletillas que pueden acompañar a cualquier frase sin cambiar su sentido.
fillers = ["vale", "gracias", "ya", "bueno", "pues", "venga", "ok", "okey", "oye", "hey", "jarvis",
           "senor", "imanol", "magana", "por", "favor", "porfa", "eh", "ahora"]

[stop]
# Cortan solo la voz del bot. Si el bot está hablando, basta con que la primera palabra sea una de
# `first_word` ("para" solo cuenta aislado o como primera palabra, nunca en medio: "no para de llover").
first_word = ["para", "calla", "callate", "basta", "silencio", "stop", "alto"]
phrases = ["para ya", "ya basta", "ya vale", "vale ya", "deja de hablar", "no sigas", "corta",
           "para para", "cierra el pico"]

[rest]
# Vuelven a reposo (standby), también con el bot callado.
phrases = ["descansa", "deja de escuchar", "eso es todo", "a dormir", "puedes descansar",
           "modo reposo", "ya puedes descansar", "no escuches"]

[close]
# Cierre de la conversación (despedida); también pasa a reposo.
phrases = ["adios", "hasta luego", "hasta manana", "buenas noches", "nos vemos", "chao", "hasta otra",
           "hasta despues"]

[ui_jarvis]
# Pasan el escritorio al modo Jarvis (evento `ui.mode`), sin LLM ni turno. Solo si el enunciado es la
# frase entera (más muletillas); cualquier otra forma de pedirlo va al agente (herramienta ui_set_mode).
phrases = ["modo jarvis", "activa el modo jarvis", "activa modo jarvis", "activar el modo jarvis",
           "pon el modo jarvis", "pon modo jarvis", "cambia a modo jarvis", "cambia al modo jarvis",
           "entra en modo jarvis", "entra en el modo jarvis"]

[ui_drakter]
# Vuelven al modo Drakter.
phrases = ["vuelve a drakter", "volver a drakter", "modo drakter", "modo normal", "sal del modo jarvis",
           "salir del modo jarvis", "desactiva el modo jarvis", "quita el modo jarvis",
           "cambia a modo drakter", "cambia al modo drakter"]

[ui]
# En [ui_jarvis] y [ui_drakter], las variantes de [wake] cuentan como «jarvis» salvo estas, que son
# variantes de «drakter» (y «despierta», que no cuenta como ninguna).
drakter_words = ["drakter", "dracter", "draxter", "dragter", "drapter", "draqter", "draquer", "draker",
                 "dracker", "tracter"]

[ui_appearance]
# Cambiar el avatar o la interfaz del modo Jarvis por voz (V1, evento `ui.appearance`), sin LLM ni turno.
# Forma cerrada: [verbo] [enlaces] [sustantivo] [enlaces] alias, y nada más salvo muletillas. Hace falta
# verbo o sustantivo («pon el orbe», «interfaz visor»); un alias suelto no cuenta. Lo demás va al agente
# (herramienta ui_set_appearance). Los alias de avatares deben incluir los `voiceAliases` de su ficha en
# desktop/src/character/avatars/<id>/register.ts (sin tildes ni artículos).
verbs = ["pon", "ponme", "usa", "cambia a", "cambia al", "cambia", "activa", "elige", "selecciona",
         "quiero", "muestra", "muestrame", "vuelve a", "vuelve al", "pasa a", "pasa al"]
links = ["el", "la", "al", "a", "a la", "del", "de", "de la", "un", "una", "mi"]
avatar_nouns = ["avatar", "personaje"]
layout_nouns = ["interfaz", "vista", "pantalla", "hud"]
# Alias que, solos, son palabras corrientes: solo valen con el sustantivo («interfaz mesa», no «pon la mesa»).
needs_noun = ["mesa", "reloj", "hilo", "hilos", "clasico", "ninguno"]
# Quitan el avatar 3D (personaje clásico).
avatar_off = ["quita el avatar", "sin avatar", "quitar el avatar", "desactiva el avatar"]

[ui_appearance.avatars]
holo-contorno = ["holo contorno", "holocontorno", "contorno", "holograma"]
holo-hilo = ["holo hilo", "holohilo", "hilo", "hilos"]
holo-busto = ["holo busto", "holobusto", "busto"]
holo-orbe = ["holo orbe", "holoorbe", "orbe"]
holo-filamento = ["holo filamento", "holofilamento", "filamento azul"]
ascuario = ["ascuario", "dragon"]
relojero = ["relojero", "reloj"]
filamento = ["filamento", "filamento dorado"]
none = ["ninguno", "clasico", "personaje clasico"]

[ui_appearance.layouts]
nucleo = ["nucleo"]
holomesa = ["holomesa", "holo mesa", "mesa"]
visor = ["visor"]

[backchannel]
# Asentimientos: se descartan sin más, salvo que el bot esté esperando una respuesta.
# Cuenta si TODAS las palabras del enunciado están aquí.
words = ["aja", "aha", "ajam", "mm", "mmm", "mhm", "hm", "hmm", "ya", "vale", "si", "ok", "okey",
         "claro", "entiendo", "ah", "oh", "eh", "em", "ehm", "bien", "genial", "perfecto", "guay",
         "exacto", "cierto", "acuerdo", "de", "venga", "bueno", "uh", "gracias"]

[wake]
# Confirmación textual de las palabras de activación (la usa voice/bridge.py). El STT transcribe
# «Jarvis» de muchas formas ("jarbes" con voz sintética, "y ya revish" con la del usuario): añadir
# una variante es editar esta lista. Además, bridge.is_wake acepta lo que quede a distancia 1 de
# «jarvis» tras normalizar la fonética y unir hasta tres palabras.
# Cuentan también como muletillas en la capa 0.
words = ["jarvis", "jarbes", "jarbis", "jarves", "jarvi", "jarbi", "yarvis", "yarbis", "harvis",
         "charvis", "chervis", "harvish", "jarvish", "yarvish", "jervis", "yervis", "jarviz", "jarbiz", "travis", "darvis",
         "llarvis", "yarevis", "yarevish", "jarevis", "harbis",
         # «Drakter» y «despierta» (modelos propios de tools/wakeword). Variantes que dio Moonshine con voces
         # sintéticas («Drag Ter» se une en «dragter»). «tractor» y «carter» no: son palabras reales.
         "drakter", "dracter", "draxter", "dragter", "drapter", "draqter", "draquer", "draker", "dracker", "tracter",
         "despierta"]
lead = ["hey", "ey", "hei", "ei", "jey", "oye", "eh", "a", "venga"]
