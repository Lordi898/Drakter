[project]
name = "drakter-voice"
version = "0.2.0"
description = "Proceso de voz de Drakter sobre Pipecat (venv propio, supervisado por el backend)"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
# Versiones fijadas por docs/DECISIONS.md (voz v2). El lock completo está en
# voice/requirements.lock y lo aplica scripts/install-voice.sh.
# drakter-contracts se instala aparte, en editable, desde contracts/python.
dependencies = [
  "pipecat-ai[webrtc,fish,kokoro]==1.16.0",
  "moonshine-voice==0.1.6",
  "openwakeword==0.4.0",
  # pipecat.transports.smallwebrtc.request_handler importa fastapi (HTTPException)
  # y el extra [webrtc] no lo incluye. No se levanta ningún servidor HTTP.
  "fastapi",
]

[tool.uv]
package = false
