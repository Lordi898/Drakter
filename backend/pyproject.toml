[project]
name = "drakter-backend"
version = "0.1.0"
description = "Backend local de Drakter"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "websockets",
    "pydantic",
    "pydantic-settings",
    "platformdirs",
    "httpx",
    "mcp",
    "drakter-contracts",
    "pypdf",
]

[dependency-groups]
dev = [
    "httpx2",
]

[tool.uv]
package = false

[tool.uv.sources]
drakter-contracts = { path = "../contracts/python", editable = true }
