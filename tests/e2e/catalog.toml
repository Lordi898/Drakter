# Catálogo de flujos E2E por HTTP. Formato: harness/flows.py.
# Si el PRIMER paso da 404/405 de enrutado, el flujo sale NO COMPROBADO; cualquier otro desvío es FALLA.
# Rutas con fuente real: indicada en cada flujo. `# PROVISIONAL:` = por confirmar al integrar.

# ---------------------------------------------------------------------------
# Conversación (scenarios/conversation.py)
# Fuente: drakter/agente-hermes backend/app/integrations/hermes/CONTRACT.md §4 (chat) y
# drakter/contratos contracts/README.md §7 (eventos).
[conversation]
# backend/CONTRACT.md: `WS /api/v1/events`, rol `ui`.
ws_path = "/api/v1/events"
sessions_path = "/api/v1/chat/sessions"
session_id_field = "id"
messages_path = "/api/v1/chat/sessions/{session_id}/messages"
turn_id_field = "turn_id"
timeout_seconds = 60
# Nombres de evento (ROADMAP §5.4; Hermes CONTRACT §4).
event_delta = "agent.message_delta"
event_completed = "agent.message_completed"
event_tool_started = "agent.tool_started"
event_tool_completed = "agent.tool_completed"
event_error = "agent.error"
# Eventos de confirmación aceptados (contratos: confirmation.requested; Hermes: agent.confirmation_required).
events_confirmation = ["confirmation.requested", "agent.confirmation_required"]

# ---------------------------------------------------------------------------
[[flow]]
id = "modulo.tareas"
title = "Tareas: crear, leer de vuelta y comprobar un campo"
# Fuente real: drakter/tareas-proyectos (api/tasks_http.py, tasks_contract.md): POST 201, GET /tasks/{uuid}.
[[flow.step]]
name = "crear tarea"
method = "POST"
path = "/api/v1/tasks"
json = { title = "e2e tarea {run}", priority = "high" }
expect = [201]
assert = { title = "e2e tarea {run}" }
capture = { id = "id" }
[[flow.step]]
name = "leer tarea"
method = "GET"
path = "/api/v1/tasks/{id}"
assert = { title = "e2e tarea {run}", priority = "high", id = "{id}" }

