[[flow]]
id = "confirmacion.destructiva"
title = "Borrar sin confirmar se rechaza, el recurso sigue, y al confirmar desaparece"
# Fuente real del DELETE: drakter/tareas-proyectos (409 `confirmation_required` + `confirmation.id`).
# Fuente del paso 4: drakter/contratos contracts/README.md §5 (POST /api/v1/confirmations/{id}/approve).
# PROVISIONAL: (a) el pipeline /confirmations no existe aún; (b) habitos-calendario responde 202 con
# `confirmation_id` en vez de 409 con `confirmation.id`: confirmar cuál queda al integrar.
# Los pasos con `unrouted_ok` dan NO COMPROBADO si su ruta aún no existe.
[[flow.step]]
name = "crear tarea"
method = "POST"
path = "/api/v1/tasks"
json = { title = "e2e borrable {run}" }
expect = [201]
capture = { id = "id" }
[[flow.step]]
name = "borrar sin confirmar"
method = "DELETE"
path = "/api/v1/tasks/{id}"
expect = [409]
assert = { "error.code" = "confirmation_required" }
capture = { confirmation_id = "confirmation.id", params_hash = "confirmation.params_hash" }
[[flow.step]]
name = "el recurso sigue existiendo"
method = "GET"
path = "/api/v1/tasks/{id}"
assert = { title = "e2e borrable {run}" }
[[flow.step]]
name = "confirmar el borrado"
unrouted_ok = true
role = "approver"  # solo este token aprueba (backend/CONTRACT.md, matriz)
method = "POST"
path = "/api/v1/confirmations/{confirmation_id}/approve"
json = { params_hash = "{params_hash}" }  # ApproveBody: el hash del ticket del 409
expect = [200]
[[flow.step]]
name = "el recurso ya no existe"
method = "GET"
path = "/api/v1/tasks/{id}"
expect = [404]
assert = { "error.code" = "not_found" }

[[flow]]
id = "auditoria.registro"
title = "Una mutación deja una entrada de auditoría consultable"
# Fuente del esquema: drakter/seguridad backend/migrations/0008_audit.sql (audit_events: action, entity_id...).
# Acción `task.create`: tasks_contract.md.
# Ruta real: GET /api/v1/activity (backend/app/api/activity.py) con `entity_id` y `limit`;
# responde {items: [AuditEventOut], next_cursor}.
[[flow.step]]
name = "crear tarea"
method = "POST"
path = "/api/v1/tasks"
json = { title = "e2e auditada {run}" }
expect = [201]
capture = { id = "id" }
[[flow.step]]
name = "consultar auditoría de esa entidad"
unrouted_ok = true
method = "GET"
path = "/api/v1/activity?entity_id={id}&limit=5"
assert = { "items.0.action" = "task.create", "items.0.entity_id" = "{id}" }
