[[flow]]
id = "modulo.relaciones"
title = "Relaciones: enlazar dos tareas y leer la relación desde la entidad"
# Fuente: drakter/almacen-relaciones storage_relations_contract.md (POST /relationships,
# GET /entities/{id}/related) y migración 0006 (related_to válido entre cualquier par de tipos).
# PROVISIONAL: api/relations.py aún no existe; confirmar 201 y que `items.0` es la arista (no virtual).
[[flow.step]]
name = "crear tarea origen"
method = "POST"
path = "/api/v1/tasks"
json = { title = "e2e origen {run}" }
expect = [201]
capture = { a = "id" }
[[flow.step]]
name = "crear tarea destino"
method = "POST"
path = "/api/v1/tasks"
json = { title = "e2e destino {run}" }
expect = [201]
capture = { b = "id" }
[[flow.step]]
name = "crear relación"
method = "POST"
path = "/api/v1/relationships"
json = { source_id = "{a}", target_id = "{b}", relationship_type = "related_to" }
expect = [200, 201]
assert = { relationship_type = "related_to" }
capture = { rid = "id" }
[[flow.step]]
name = "leer relaciones de la entidad"
method = "GET"
path = "/api/v1/entities/{a}/related"
assert = { "items.0.entity_id" = "{b}", "items.0.relationship_id" = "{rid}" }

